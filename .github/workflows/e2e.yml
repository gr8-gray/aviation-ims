name: E2E

# Aviation IMS is not deployed anywhere — E2E recreates the full local stack
# in CI: Postgres service container -> migrations + seed -> Express API
# (DEV_AUTH=true) -> Vite dev server -> Playwright.
on:
  schedule:
    - cron: '0 14 * * 1' # weekly, Mondays 14:00 UTC
  workflow_dispatch:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aviation_ims
          POSTGRES_USER: ims_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ims_app -d aviation_ims"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: aviation_ims
      DB_USER: ims_app
      DB_PASSWORD: ci_only_not_a_secret
      DEV_AUTH: 'true'
      PORT: '3000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies (root, server, client)
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run migrations
        run: |
          for f in server/db/migrations/*.sql; do
            echo "Applying $f"
            psql "postgresql://ims_app:ci_only_not_a_secret@localhost:5432/aviation_ims" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed demo data
        run: node server/db/seeds/seed.js

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
